- id: connection
  config:
    trustedHosts: !!js ctx.webRuntime.trustedHosts
    authToken: !!js process.env.DSH_DESKTOP_AUTH_TOKEN

- insert:
    - id: desktop-native
      name: __DSH_DESKTOP_NATIVE_ENTRY__
      config:
        endpoint: !!js process.env.DSH_DESKTOP_BRIDGE_URL
        token: !!js process.env.DSH_DESKTOP_BRIDGE_TOKEN
