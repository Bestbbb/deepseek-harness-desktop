- id: web-runtime
  config:
    openBrowser: !!js ctx.webStartup.openBrowser
    printUrl: true
    surfaceContext: false
    trustedHosts: !!js ctx.webStartup.trustedHosts
- insert:
    - id: desktop-native
      name: __DSH_DESKTOP_NATIVE_ENTRY__
      config:
        notifyOnTurnEnd: true
        endpoint: !!js process.env.DSH_DESKTOP_BRIDGE_URL
        token: !!js process.env.DSH_DESKTOP_BRIDGE_TOKEN
