<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>DeepSeek Harness</title>
    <style>
      :root {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #182230;
        background: #f4f7fb;
      }
      @media (prefers-color-scheme: dark) {
        :root { color: #f5f7fa; background: #101318; }
        .card { background: #171b22 !important; border-color: #2a303a !important; }
        .muted { color: #9ba7b5 !important; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      .card {
        width: min(420px, calc(100vw - 48px));
        padding: 36px;
        text-align: center;
        border: 1px solid #e1e7ef;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 18px 60px rgb(19 33 55 / 10%);
      }
      .mark {
        width: 48px;
        height: 48px;
        margin: 0 auto 20px;
        display: grid;
        place-items: center;
        border-radius: 14px;
        color: #fff;
        background: linear-gradient(145deg, #4b8cff, #5b5bea);
        font-size: 24px;
        font-weight: 700;
      }
      h1 { margin: 0; font-size: 20px; font-weight: 650; }
      .muted { margin: 10px 0 0; color: #657386; font-size: 14px; line-height: 1.6; }
      .spinner {
        width: 22px;
        height: 22px;
        margin: 24px auto 0;
        border: 2px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        animation: spin .8s linear infinite;
        opacity: .65;
      }
      #error { display: none; color: #c23838; white-space: pre-wrap; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark">D</div>
      <h1>DeepSeek Harness</h1>
      <p id="status" class="muted">Starting the local agent runtime…</p>
      <p id="error" class="muted"></p>
      <div id="spinner" class="spinner" aria-label="Loading"></div>
    </main>
    <script>
      addEventListener('dsh-desktop-runtime-error', (event) => {
        document.querySelector('#status').textContent = 'The local runtime could not start.'
        document.querySelector('#error').textContent = event.detail
        document.querySelector('#error').style.display = 'block'
        document.querySelector('#spinner').style.display = 'none'
      })
    </script>
  </body>
</html>
