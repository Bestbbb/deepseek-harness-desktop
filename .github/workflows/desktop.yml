name: Desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/desktop.yml'
      - 'apps/desktop/**'
      - 'apps/desktop-runtime/**'
      - 'packages/client/connection/**'
      - 'packages/client/runtime/**'
      - 'packages/client/ui-conversation/**'
      - 'packages/client/ui-settings-general/**'
      - 'packages/client/ui-settings-models/**'
      - 'packages/client/ui-sidebar/**'
      - 'packages/desktop/**'
      - 'scripts/check-workspace-constraints.ts'
      - 'scripts/verify-runtime-closure.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.host.json'
  push:
    tags:
      - 'desktop-v*'

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-15
            artifact: harness-desktop-macos-arm64
          - target: windows-x64
            runner: windows-2025
            artifact: harness-desktop-windows-x64
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build application and bundled runtime
        run: pnpm run desktop:prepare

      - name: Verify bundled runtime and desktop authentication
        run: pnpm run desktop:smoke

      - name: Test desktop TypeScript surfaces
        run: pnpm run desktop:test

      - name: Test native host
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Build desktop installers
        if: runner.os != 'Windows'
        run: pnpm --filter @deepseek-ai/dsh-desktop-app run tauri:build

      - name: Build desktop installer from a short Windows path
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'apps\desktop'
          $shortRoot = Join-Path $env:RUNNER_TEMP "dsh-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Path $shortRoot | Out-Null

          robocopy $source $shortRoot /E /R:2 /W:1 /XD `
            (Join-Path $source 'node_modules') `
            (Join-Path $source '.runtime-cache') `
            (Join-Path $source 'src-tauri\target')
          if ($LASTEXITCODE -ge 8) {
            throw "robocopy failed with exit code $LASTEXITCODE"
          }

          Push-Location $shortRoot
          & (Join-Path $source 'node_modules\.bin\tauri.cmd') build
          $buildExit = $LASTEXITCODE
          Pop-Location
          if ($buildExit -ne 0) {
            throw "tauri build failed with exit code $buildExit"
          }

          $artifactDir = Join-Path $source 'src-tauri\target\release\bundle\nsis'
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          Copy-Item (Join-Path $shortRoot 'src-tauri\target\release\bundle\nsis\*.exe') $artifactDir

      - name: Upload macOS application and DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/macos/*.app
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows installers
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
