name: CI

# The upstream repository uses private larger-runner and self-hosted pools that
# are not available to an independent community distribution. Keep one
# comprehensive, keyless aggregate on GitHub-hosted Linux; the separate Desktop
# workflow owns target-native macOS and Windows packaging.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  validation:
    name: community / keyless
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Standard hosted runners have fewer cores than the upstream enterprise
      # pools. Bound the aggregate and its heaviest nested test schedulers.
      DSH_GATE_CONCURRENCY: '2'
      DSH_COVERAGE_MAX_WORKERS: '2'
      DSH_OXLINT_THREADS: '2'
      DSH_SNAPSHOT_MAX_CONCURRENCY: '4'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Prepare bubblewrap
        run: bash scripts/prepare-ci-bubblewrap.sh

      - name: Run comprehensive keyless checks
        env:
          DSH_ARCHIVE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: pnpm run check:ci
