name: Issue lifecycle (upstream-only)

# The upstream workflow requires a DeepSeek organization GitHub App and project
# configuration. The community desktop distribution keeps this stub for
# upstream-sync context but does not run it on issue or pull-request events.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    name: Upstream issue lifecycle is disabled
    runs-on: ubuntu-latest
    steps:
      - run: echo "The DeepSeek upstream issue lifecycle is not used by this community repository."
