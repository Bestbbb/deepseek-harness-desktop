name: Issue policy (upstream-only)

# The upstream repository binds this policy to its own labels, review process,
# and repository identity. The community desktop distribution keeps this stub
# for upstream-sync context but does not run it on pull requests.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    name: Upstream issue policy is disabled
    runs-on: ubuntu-latest
    steps:
      - run: echo "The DeepSeek upstream issue policy is not used by this community repository."
